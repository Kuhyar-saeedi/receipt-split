<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Receipt Split</title>
  <meta name="description" content="Enter the items from a shared grocery run, tag who each is for, see who owes the buyer what.">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Split">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Receipt<span>Split</span></h1>
    <button id="resetBtn" class="ghost small" type="button">New receipt</button>
  </header>

  <main>
    <!-- 1. People -->
    <section class="card">
      <div class="card-head">
        <h2><b>1</b> People</h2>
        <p class="hint">Add everyone, including the buyer. Tap a name to mark who <b>paid</b>.</p>
      </div>
      <div id="peopleList" class="people"></div>
      <form id="addPersonForm" class="row">
        <input id="personInput" type="text" placeholder="Name" maxlength="20" autocomplete="off" autocapitalize="words" enterkeyhint="done" aria-label="Person name">
        <button type="submit" class="primary">Add</button>
      </form>
    </section>

    <!-- 2. Items -->
    <section class="card" id="itemsCard">
      <div class="card-head">
        <h2><b>2</b> Items</h2>
        <p class="hint">Type the price, tap who it's for. <b>ALL</b> = split between everyone.</p>
      </div>
      <ol id="itemList" class="items"></ol>
      <button id="addItemBtn" class="add-line" type="button">+ Add item</button>
      <div id="checkBar" class="check"></div>
    </section>

    <!-- 3. Result -->
    <section class="card result" id="resultCard" hidden>
      <div class="card-head">
        <h2><b>3</b> Settle up</h2>
      </div>
      <div id="resultBody"></div>
      <button id="shareBtn" class="primary wide" type="button">Share result</button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="split.js"></script>
  <script src="app.js"></script>
</body>
</html>
